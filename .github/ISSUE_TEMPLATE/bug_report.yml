name: Bug report
description: The review, the gate or the threads action didn't do what the docs say
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Don't paste tokens, or anything from a private repository. For a vulnerability, use
        [private vulnerability reporting](https://github.com/Quartel-Enterprise/claude-review/security/advisories/new).
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - review
        - gate
        - threads
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release in your `uses:`
      placeholder: 1.5.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Link to the run
      description: The run's log shows what the Stop hook saw and any warnings. Leave it out if the repository is private.
  - type: textarea
    id: workflow
    attributes:
      label: Your workflow
      description: The calling workflow and the inputs you pass, without secrets.
      render: yaml
