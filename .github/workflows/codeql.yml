name: codeql

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, so a new query finds what an old commit already holds.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL has no shell analysis: `actions` covers the workflows and the actions' own steps,
        # `python` covers review/extract-findings.py.
        language:
          - actions
          - python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
