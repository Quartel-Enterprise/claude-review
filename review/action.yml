name: 'AI review'
description: 'Reviews a pull request with Claude, Gemini, or both, optionally fixes findings, and posts them as one pull request review'

inputs:
  providers:
    description: "Comma-separated list of AI providers to run: 'claude', 'gemini' (or alias 'antigravity'), or 'claude,gemini'. Required."
    required: true
  claude-oauth-token:
    description: 'A Claude Code OAuth token (claude setup-token). Required (or anthropic-api-key) when claude is enabled.'
    required: false
    default: ''
  anthropic-api-key:
    description: 'An Anthropic API key. Required (or claude-oauth-token) when claude is enabled.'
    required: false
    default: ''
  gemini-api-key:
    description: 'A Google AI Studio Gemini API key. Required when gemini is enabled.'
    required: false
    default: ''
  claude-model:
    description: "Model for Claude: an alias (opus, sonnet, haiku) or full model id. Defaults to 'opus' when claude is enabled."
    required: false
    default: ''
  gemini-model:
    description: "Model for Gemini: an alias (carbon, neon, argon, hydrogen) or full model id. Defaults to 'gemini-4-neon' when gemini is enabled."
    required: false
    default: ''
  effort:
    description: "Default review effort for all providers: low, medium, high, xhigh or max. Higher finds more and costs more."
    required: false
    default: 'high'
  claude-effort:
    description: "Effort override for Claude (low, medium, high, xhigh or max). Inherits 'effort' when empty."
    required: false
    default: ''
  gemini-effort:
    description: "Effort override for Gemini (low, medium, high, xhigh or max). Inherits 'effort' when empty."
    required: false
    default: ''
  gemini-cli-version:
    description: "Pinned @google/gemini-cli version installed for Gemini runs."
    required: false
    default: '0.71.1'
  max-findings:
    description: "How many findings each provider reports at most, most severe first: 'all' or a number."
    required: false
    default: 'all'
  github-token:
    description: "A token of your own GitHub App, to post and push as that App. When set, bot-login and bot-id are required."
    required: false
    default: ''
  bot-login:
    description: "The login of the bot user the review posts as (e.g. my-app[bot]). Required when github-token is set; otherwise defaults to claude[bot] (when claude is enabled) or github-actions[bot]."
    required: false
    default: ''
  bot-id:
    description: "The numeric user id of bot-login (gh api 'users/<bot-login>' --jq .id). Required when github-token is set."
    required: false
    default: ''
  instructions:
    description: 'Extra instructions appended to the review prompt.'
    required: false
    default: ''
  memory-repository:
    description: "A private repository of agent memories (owner/name) whose conventions the review follows too. Empty for none."
    required: false
    default: ''
  memory-ssh-key:
    description: 'A read-only deploy key of memory-repository. Required when memory-repository is set.'
    required: false
    default: ''
  memory-files:
    description: "Sparse-checkout pattern of files in memory-repository to read. Required when memory-repository is set."
    required: false
    default: ''
  fix:
    description: "'true' to apply clear, contained findings and push them as one commit to the pull request's branch."
    required: false
    default: 'false'
  cost:
    description: "'true' to comment the run's cost and timing on the pull request, 'false' to leave it out."
    required: false
    default: 'true'
  show-micro-costs:
    description: "'true' to include auxiliary models spending less than $0.01 (such as Haiku background calls) in the cost breakdown. Defaults to 'false'."
    required: false
    default: 'false'
  allowed-bots:
    description: "Bots whose pull requests and pushes are reviewed too, as a comma-separated list of logins without [bot] (e.g. 'renovate,dependabot'). Empty for none."
    required: false
    default: ''

outputs:
  total-duration-seconds:
    description: 'Sum of execution times across all enabled providers, in seconds.'
    value: ${{ steps.summary.outputs.total-duration-seconds }}
  provider-durations:
    description: 'JSON object mapping each provider name to its execution duration in seconds.'
    value: ${{ steps.summary.outputs.provider-durations }}
  total-cost-usd:
    description: 'Total reported/estimated cost in USD (after applying show-micro-costs).'
    value: ${{ steps.summary.outputs.total-cost-usd }}

runs:
  using: "composite"
  steps:
    - id: config
      name: Check the inputs
      shell: bash
      env:
        RAW_PROVIDERS: ${{ inputs.providers }}
        HAS_CLAUDE_OAUTH: ${{ inputs.claude-oauth-token != '' }}
        HAS_ANTHROPIC_KEY: ${{ inputs.anthropic-api-key != '' }}
        HAS_GEMINI_KEY: ${{ inputs.gemini-api-key != '' }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
        EFFORT: ${{ inputs.effort }}
        CLAUDE_EFFORT: ${{ inputs.claude-effort }}
        GEMINI_EFFORT: ${{ inputs.gemini-effort }}
        GEMINI_CLI_VERSION: ${{ inputs.gemini-cli-version }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        FIX: ${{ inputs.fix }}
        COST: ${{ inputs.cost }}
        SHOW_MICRO_COSTS: ${{ inputs.show-micro-costs }}
        HAS_GITHUB_TOKEN: ${{ inputs.github-token != '' }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        BOT_ID: ${{ inputs.bot-id }}
        MEMORY_REPO: ${{ inputs.memory-repository }}
        HAS_MEMORY_KEY: ${{ inputs.memory-ssh-key != '' }}
        MEMORY_FILES: ${{ inputs.memory-files }}
      run: |
        errors=0
        error() {
          echo "::error::$*"
          errors=$((errors + 1))
        }

        run_claude=false
        run_gemini=false
        canonical=()
        IFS=',' read -r -a raw_list <<< "$RAW_PROVIDERS"
        for item in "${raw_list[@]}"; do
          p=$(tr '[:upper:]' '[:lower:]' <<< "$item" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -n "$p" ] || continue
          case "$p" in
            claude)
              if [ "$run_claude" = false ]; then
                run_claude=true
                canonical+=(claude)
              fi
              ;;
            gemini | antigravity)
              if [ "$run_gemini" = false ]; then
                run_gemini=true
                canonical+=(gemini)
              fi
              ;;
            *)
              error "Unknown provider '$p': supported providers are 'claude' and 'gemini' (alias: 'antigravity')."
              ;;
          esac
        done
        if [ "${#canonical[@]}" -eq 0 ]; then
          error "providers must list at least one provider ('claude', 'gemini', or 'claude,gemini')."
        fi
        providers_csv=$(IFS=','; echo "${canonical[*]}")

        if [ "$run_claude" = true ]; then
          if [ "$HAS_CLAUDE_OAUTH" = "$HAS_ANTHROPIC_KEY" ]; then
            error "When claude is enabled, set exactly one of claude-oauth-token and anthropic-api-key."
          fi
        fi
        if [ "$run_gemini" = true ] && [ "$HAS_GEMINI_KEY" != true ]; then
          error "When gemini is enabled, gemini-api-key is required."
        fi

        claude_model=${CLAUDE_MODEL:-opus}
        [[ "$claude_model" =~ ^[A-Za-z0-9._:-]+(\[[0-9a-z]+\])?$ ]] || error "claude-model '$claude_model' isn't a valid model alias or id."

        raw_gemini=${GEMINI_MODEL:-neon}
        case "${raw_gemini,,}" in
          neon) gemini_model="gemini-4-neon" ;;
          carbon) gemini_model="gemini-4-carbon" ;;
          argon) gemini_model="gemini-4-argon" ;;
          hydrogen) gemini_model="gemini-4-hydrogen" ;;
          *) gemini_model="$raw_gemini" ;;
        esac
        [[ "$gemini_model" =~ ^[A-Za-z0-9._:/-]+$ ]] || error "gemini-model '$raw_gemini' isn't a valid model alias or id."
        [[ "$GEMINI_CLI_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || error "gemini-cli-version '$GEMINI_CLI_VERSION' isn't a valid version."

        check_effort() {
          if ! [[ "$2" =~ ^[A-Za-z0-9-]+$ ]]; then
            error "$1 '$2' isn't a valid effort level."
            return
          fi
          case "$2" in
            low | medium | high | xhigh | max) ;;
            *) echo "::warning::$1 '$2' is not one of the standard levels (low, medium, high, xhigh, max); passing it through to the provider." ;;
          esac
        }
        effort_norm=${EFFORT,,}
        claude_effort=${CLAUDE_EFFORT:-$effort_norm}
        claude_effort=${claude_effort,,}
        gemini_effort=${GEMINI_EFFORT:-$effort_norm}
        gemini_effort=${gemini_effort,,}
        check_effort "effort" "$effort_norm"
        check_effort "claude-effort" "$claude_effort"
        check_effort "gemini-effort" "$gemini_effort"

        [[ "$MAX_FINDINGS" =~ ^(all|[1-9][0-9]*)$ ]] || error "max-findings '$MAX_FINDINGS' isn't 'all' or a number."
        for flag_name in fix cost show-micro-costs; do
          case "$flag_name" in
            fix) val=$FIX ;;
            cost) val=$COST ;;
            show-micro-costs) val=$SHOW_MICRO_COSTS ;;
          esac
          case "$val" in
            true | false) ;;
            *) error "$flag_name '$val' must be 'true' or 'false'." ;;
          esac
        done

        if [ "$HAS_GITHUB_TOKEN" = true ]; then
          [ -n "$BOT_LOGIN" ] || error "bot-login is required when github-token is set."
          [ -n "$BOT_ID" ] || error "bot-id is required when github-token is set."
          bot_login=$BOT_LOGIN
          bot_id=$BOT_ID
        else
          if [ "$run_claude" = true ]; then
            bot_login=${BOT_LOGIN:-claude[bot]}
            bot_id=${BOT_ID:-209825114}
          else
            bot_login=${BOT_LOGIN:-github-actions[bot]}
            bot_id=${BOT_ID:-41898282}
          fi
          if [ "$FIX" = true ] && [ "$run_claude" = false ]; then
            echo "::warning::fix is 'true' without github-token on a Gemini-only run: pushing with GITHUB_TOKEN requires 'permissions: contents: write' on the job, and pushed commits will not trigger pull request workflows. Pass a GitHub App token via github-token if you use the gate action."
          fi
        fi
        if [ -n "$bot_login" ]; then
          [[ "$bot_login" =~ ^[A-Za-z0-9-]+\[bot\]$ ]] || error "bot-login '$bot_login' isn't a bot user's login, such as claude[bot] or github-actions[bot]."
        fi
        if [ -n "$bot_id" ]; then
          [[ "$bot_id" =~ ^[0-9]+$ ]] || error "bot-id '$bot_id' isn't a numeric user id."
        fi

        if [ -n "$MEMORY_REPO" ]; then
          [ "$HAS_MEMORY_KEY" = true ] || error "memory-ssh-key is required when memory-repository is set."
          [ -n "$MEMORY_FILES" ] || error "memory-files is required when memory-repository is set."
        fi

        if [ "$run_claude" = true ]; then
          if [ "$RUNNER_OS" != Linux ] || ! command -v apt-get > /dev/null; then
            error "Claude runs on an Ubuntu runner only: its sandbox is installed with apt-get."
          fi
        elif [ "$RUNNER_OS" != Linux ]; then
          error "The review runs on a Linux runner only."
        fi

        [ "$errors" -eq 0 ] || exit 1

        {
          echo "providers=$providers_csv"
          echo "run-claude=$run_claude"
          echo "run-gemini=$run_gemini"
          echo "claude-model=$claude_model"
          echo "claude-effort=$claude_effort"
          echo "gemini-model=$gemini_model"
          echo "gemini-effort=$gemini_effort"
          echo "bot-login=$bot_login"
          echo "bot-id=$bot_id"
        } >> "$GITHUB_OUTPUT"

    - id: event
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EVENT_ACTION: ${{ github.event.action }}
        SENDER: ${{ github.event.sender.login }}
        ACTOR: ${{ github.actor }}
        BOT_LOGIN: ${{ steps.config.outputs.bot-login }}
        ALLOWED_BOTS: ${{ inputs.allowed-bots }}
        HEAD_REF: ${{ github.head_ref }}
        OPENED_AT: ${{ github.event.pull_request.created_at }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        review() {
          echo "review=$1" >> "$GITHUB_OUTPUT"
          exit 0
        }
        # Skip bot-triggered runs unless explicitly allowlisted (matches claude-code-action: '*' allows all bots).
        if [[ "$ACTOR" == *"[bot]" ]]; then
          bot_name=${ACTOR%"[bot]"}
          bot_name=${bot_name,,}
          allowed=false
          IFS=',' read -r -a bots <<< "$ALLOWED_BOTS"
          for b in "${bots[@]}"; do
            b=$(sed 's/^[[:space:]]*//;s/[[:space:]]*$//' <<< "$b")
            b=${b%"[bot]"}
            b=${b,,}
            if [ "$b" = "*" ] || { [ -n "$b" ] && [ "$b" = "$bot_name" ]; }; then
              allowed=true
              break
            fi
          done
          if [ "$allowed" != true ]; then
            echo "::notice::Bot actor '$ACTOR' is not listed in allowed-bots, so this run is skipped."
            review false
          fi
        fi

        [ "$EVENT_ACTION" = synchronize ] || review true
        if [ "$SENDER" = "$BOT_LOGIN" ]; then
          echo "::notice::A push by $BOT_LOGIN, the review's own fix commit, isn't reviewed."
          review false
        fi
        if ! run=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '"\(.workflow_id) \(.created_at)"') ||
          ! ready=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "ready_for_review") | .created_at' | tail -n 1); then
          echo "::warning::This workflow's earlier runs couldn't be read (does the job have actions: read?), so this push isn't reviewed."
          review false
        fi
        read -r workflow created <<< "$run"
        since=${ready:-$OPENED_AT}
        if ! earlier=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=$HEAD_REF&event=pull_request&created=%3E%3D$since&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .created_at < \"$created\")] | length"); then
          echo "::warning::This workflow's earlier runs couldn't be read (does the job have actions: read?), so this push isn't reviewed."
          review false
        fi
        if [ "$earlier" -gt 0 ]; then
          echo "::notice::The pull request was reviewed when it opened, so this push isn't."
          review false
        fi
        echo "::notice::No run of this workflow since the pull request opened, which GitHub skips while it conflicts with its base, so this push is reviewed."
        review true

    - id: memory
      if: steps.event.outputs.review == 'true' && inputs.memory-repository != '' && inputs.memory-ssh-key != '' && inputs.memory-files != ''
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.memory-repository }}
        ssh-key: ${{ inputs.memory-ssh-key }}
        path: .agent-memory
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: ${{ inputs.memory-files }}
        sparse-checkout-cone-mode: false

    - id: memory-instructions
      if: steps.event.outputs.review == 'true'
      shell: bash
      env:
        MEMORY_REPOSITORY: ${{ inputs.memory-repository }}
        MEMORY_OUTCOME: ${{ steps.memory.outcome }}
        MEMORY_FILES: ${{ inputs.memory-files }}
      run: |
        [ -n "$MEMORY_REPOSITORY" ] || exit 0
        if [ "$MEMORY_OUTCOME" != success ]; then
          echo "::warning::The agent memories weren't checked out, so the review runs without them."
          exit 0
        fi
        echo ".agent-memory/" >> .git/info/exclude
        {
          echo "text<<MEMORY_INSTRUCTIONS_END"
          echo "The maintainer's conventions for this repository are in .agent-memory/$MEMORY_FILES,"
          echo "one per file: read them all and treat them with the same weight as AGENTS.md, CLAUDE.md, and GEMINI.md."
          echo "They are private and this repository may be public: cite a convention in your own words,"
          echo "never quote a file or name its path in a finding, even where the review's recipe"
          echo "asks you to quote the rule. .agent-memory is not part of the pull request: never"
          echo "review it."
          echo "MEMORY_INSTRUCTIONS_END"
        } >> "$GITHUB_OUTPUT"

    - id: earlier
      if: steps.event.outputs.review == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BOT_LOGIN: ${{ steps.config.outputs.bot-login }}
      run: |
        comments=$(
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == env.BOT_LOGIN)
              | "- \(.path):\(.line // .original_line): \(.body | gsub("\\s+"; " ") | .[0:300])"' \
            || echo "::warning::The earlier inline comments couldn't be read, so the review isn't told about them." >&2
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" or .user.login == env.BOT_LOGIN)
              | .body | select(test("^### Code review"))
              | gsub("\\s*<!-- (?:ai|claude)-review run [^>]*-->"; "")
              | split("\n\n")[1:]
              | reduce .[] as $paragraph ({items: [], fenced: false};
                  (if (.fenced | not) and ($paragraph | test("^> ⚠️")) then .
                    elif (.fenced | not) and ($paragraph | test("^[0-9]+\\. (`|\\(no file\\))")) then .items += [$paragraph]
                    elif (.items | length) > 0 then .items[-1] += " " + $paragraph else . end)
                  | .fenced = (.fenced != ([$paragraph | scan("(?m)^\\s*```")] | length % 2 == 1)))
              | .items[] | "- " + (gsub("\\s+"; " ") | .[0:300])' \
            || echo "::warning::The earlier review bodies couldn't be read, so the review isn't told about them." >&2
        )
        {
          echo "text<<EARLIER_COMMENTS_END"
          if [ -n "$comments" ]; then
            echo "An AI reviewer reviewed this pull request before and left these comments. Don't report an"
            echo "issue one of them already raised:"
            echo "$comments"
          fi
          echo "EARLIER_COMMENTS_END"
        } >> "$GITHUB_OUTPUT"

    - id: tools
      if: steps.event.outputs.review == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FIX: ${{ inputs.fix }}
      run: |
        dir="$RUNNER_TEMP/ai-review"
        state="$RUNNER_TEMP/ai-review-state"
        if [ -d "$dir" ]; then
          chmod -R u+w "$dir"
          rm -rf "$dir"
        fi
        rm -rf "$state"
        mkdir -p "$dir" "$state"
        cp "$GITHUB_ACTION_PATH"/{stop-hook.sh,post-review.sh,post-cost.sh,extract-findings.py,merge-findings.py,summarize-cost.py,commit-fixes.sh,bash-guard.sh,gemini-guard.sh,gemini-run.sh,gemini-prompt.md} "$dir/"
        chmod +x "$dir"/*.sh
        chmod -R a-w "$dir"

        # Remove symlinks leaving the checkout or entering .git, .github, .claude, or .gemini.
        root=$(realpath "$PWD")
        while IFS= read -r -d '' link; do
          case "$(realpath -m "$link")" in
            "$root"/.git | "$root"/.git/* | "$root"/.github | "$root"/.github/*) ;;
            "$root"/.claude | "$root"/.claude/* | "$root"/.gemini | "$root"/.gemini/*) ;;
            "$root"/*) continue ;;
          esac
          rm -f "$link"
          shown=${link//'%'/%25}
          shown=${shown//$'\r'/%0D}
          shown=${shown//$'\n'/%0A}
          echo "::notice::$shown points outside the checkout or into .git, .github, .claude or .gemini, so the review doesn't see it."
        done < <(find . -path ./.git -prune -o -type l -print0)

        reviewed="$PWD"
        if [ "$FIX" = true ]; then
          reviewed="$(dirname "$RUNNER_TEMP")/reviewed-head"
          rm -rf "$reviewed"
          mkdir -p "$reviewed"
          if files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | if .status == "removed" then "" else .filename end'); then
            if [ "$(wc -l <<< "$files")" -ge 3000 ]; then
              echo "::warning::The pull request changes 3,000 files or more, so the copy of the reviewed commit may miss some."
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              mkdir -p "$reviewed/$(dirname "$file")"
              git show "HEAD:$file" > "$reviewed/$file" 2> /dev/null || rm -f "$reviewed/$file"
            done <<< "$files"
          else
            echo "::warning::The pull request's files couldn't be listed, so the review has no copy of the reviewed commit."
          fi
        fi
        {
          echo "dir=$dir"
          echo "state=$state"
          echo "reviewed=$reviewed"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_OUTPUT"

    # Gemini runs before Claude when both are enabled, so Claude's Stop hook can merge both sets of
    # findings and post/push once while the Claude GitHub App OIDC token is active.
    - id: gemini
      name: Run Gemini review
      if: steps.event.outputs.review == 'true' && steps.config.outputs.run-gemini == 'true'
      continue-on-error: ${{ steps.config.outputs.run-claude == 'true' }}
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        STATE: ${{ steps.tools.outputs.state }}
        REVIEWED_DIR: ${{ steps.tools.outputs.reviewed }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FIX: ${{ inputs.fix }}
        GEMINI_MODEL: ${{ steps.config.outputs.gemini-model }}
        GEMINI_EFFORT: ${{ steps.config.outputs.gemini-effort }}
        GEMINI_CLI_VERSION: ${{ inputs.gemini-cli-version }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
        MEMORY_INSTRUCTIONS: ${{ steps.memory-instructions.outputs.text }}
        EARLIER_COMMENTS: ${{ steps.earlier.outputs.text }}
        EXTRA_INSTRUCTIONS: ${{ inputs.instructions }}
      run: '"${{ steps.tools.outputs.dir }}/gemini-run.sh"'

    - id: mode
      if: steps.event.outputs.review == 'true' && steps.config.outputs.run-claude == 'true'
      shell: bash
      env:
        FIX: ${{ inputs.fix }}
        RUN_GEMINI: ${{ steps.config.outputs.run-gemini }}
        REVIEWED_DIR: ${{ steps.tools.outputs.reviewed }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        WORKSPACE: ${{ github.workspace }}
        EFFORT: ${{ steps.config.outputs.claude-effort }}
        MAX_FINDINGS: ${{ inputs.max-findings }}
      run: |
        if [ "$FIX" = true ]; then
          {
            echo "arguments=$EFFORT $PR_NUMBER --fix --max-findings $MAX_FINDINGS"
            echo "tools=Task,Bash,Read,Edit,Grep,Glob,Skill"
            echo "allowed=,Edit(/$WORKSPACE/**)"
            echo "denied=Write,NotebookEdit,Edit(/$WORKSPACE/.git/**),Edit(/$WORKSPACE/.github/**),Edit(/$WORKSPACE/.claude/**),Edit(/$WORKSPACE/.gemini/**),Edit(/$WORKSPACE/.agent-memory/**),"
            echo "task<<TASK_END"
            if [ "$RUN_GEMINI" = true ]; then
              echo "and let it apply its findings to the working tree. Note that Gemini already ran and"
              echo "may have applied its own fixes to the working tree: don't revert Gemini's fixes,"
              echo "don't report issues inside them as author bugs, and always verify line numbers and"
              echo "pre-fix code against $REVIEWED_DIR/<file> (the untouched reviewed head commit)."
            else
              echo "and let it apply its findings to the working tree, which is the pull request's head"
              echo "commit."
            fi
            echo "Apply a fix only when it is clear and stays within what the finding describes,"
            echo "editing files that already exist; leave a finding that needs the author's call (a design"
            echo "choice, a product behaviour, a fix that needs a new file) as it is. Never edit anything"
            echo "under .git, .github, .claude, .gemini or .agent-memory, and don't commit or push: a later step"
            echo "commits the working tree to the pull request's branch."
            echo "TASK_END"
            echo "outcome<<OUTCOME_END"
            echo ', and "outcome": "fixed" when the working tree now holds its fix, "skipped" when it'
            echo 'was left for the author, or "no_change_needed" when a closer look showed nothing to change'
            echo "OUTCOME_END"
            echo "posting=A later step commits the fixes and posts that array as one pull request review."
            echo "editing=and don't invoke any other skill."
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "arguments=$EFFORT $PR_NUMBER --max-findings $MAX_FINDINGS"
            echo "tools=Task,Bash,Read,Grep,Glob,Skill"
            echo "allowed="
            echo "denied=Write,Edit,NotebookEdit,"
            echo "task=and wait for its findings."
            echo "outcome="
            echo "posting=A later step posts that array as one pull request review."
            echo "editing=don't invoke any other skill and don't edit any file."
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Install the sandbox's dependencies
      if: steps.event.outputs.review == 'true' && steps.config.outputs.run-claude == 'true'
      shell: bash
      run: |
        install_sandbox() { sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat > /dev/null; }
        if ! command -v bwrap > /dev/null || ! command -v socat > /dev/null; then
          install_sandbox || { sudo apt-get update -qq && install_sandbox; } || true
        fi
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if ! command -v socat > /dev/null || ! bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true; then
          echo "::warning::bubblewrap can't start a sandbox on this runner, so the review's Bash commands will fail."
        fi

    - id: claude-start
      if: steps.event.outputs.review == 'true' && steps.config.outputs.run-claude == 'true'
      shell: bash
      run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - id: claude
      if: steps.event.outputs.review == 'true' && steps.config.outputs.run-claude == 'true'
      # An exact release: v1 moves, and would change what a pinned release of this action does.
      uses: anthropics/claude-code-action@4845bacbb38b3c4b15d948f035349786f678e068 # v1.0.267
      continue-on-error: ${{ steps.config.outputs.run-gemini == 'true' }}
      env:
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        BOT_LOGIN: ${{ steps.config.outputs.bot-login }}
        BOT_ID: ${{ steps.config.outputs.bot-id }}
        PROVIDERS: ${{ steps.config.outputs.providers }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        bot_name: ${{ steps.config.outputs.bot-login }}
        bot_id: ${{ steps.config.outputs.bot-id }}
        allowed_bots: ${{ inputs.allowed-bots }}
        settings: |
          {"hooks": {"PreToolUse": [{"matcher": "Bash", "hooks": [{"type": "command", "command": "${{ steps.tools.outputs.dir }}/bash-guard.sh ${{ steps.tools.outputs.state }}"}]}], "Stop": [{"hooks": [{"type": "command", "command": "${{ steps.tools.outputs.dir }}/stop-hook.sh ${{ steps.tools.outputs.state }} ${{ steps.tools.outputs.started }} ${{ inputs.fix }}", "timeout": 600}]}]}}
        prompt: |
          Review pull request #${{ github.event.pull_request.number }} of this repository: invoke the
          `code-review` skill once, with `${{ steps.mode.outputs.arguments }}` as its arguments,
          ${{ steps.mode.outputs.task }}

          End your reply with the skill's findings as a JSON array inside a ```json fence, and nothing
          after it: one object per finding, most severe first, each with "file", "line" (in the new
          version of the file), "summary", "failure_scenario", "category" and "severity", plus
          "start_line" when the finding spans lines, and "fix" and "suggestion" as described
          below${{ steps.mode.outputs.outcome }}. Write `[]` when there are none.
          ${{ steps.mode.outputs.posting }} Don't post anything to GitHub yourself, don't run the
          app, ${{ steps.mode.outputs.editing }}

          - "severity" is one of:
            - "must-fix": the change shouldn't merge with it: a bug users would hit (a crash, wrong
              data, data loss, a broken flow), a security hole, a race that corrupts state.
            - "should-fix": a real problem worth fixing in this pull request, with a limited impact:
              an edge case, error handling that degrades the experience, an AGENTS.md, CLAUDE.md,
              GEMINI.md or maintainer convention the change breaks, a cleanup that clearly pays off.
            - "nitpick": optional: naming, wording, a small simplification, style the tooling
              doesn't enforce.
          - "fix": one or two sentences on how to fix it, written for the author. Markdown is fine,
            with a short code sketch in a fenced block when the fix spans several places.
          - "suggestion": only when replacing lines "start_line" to "line" (or "line" alone) of the
            file, and nothing else, fully fixes the finding: the exact text that replaces those
            lines, every line whole and indented as in the file. Read those lines from the reviewed
            commit's copy, `${{ steps.tools.outputs.reviewed }}/<file>`, instead of recalling them,
            and keep "line" and "start_line" on exactly the lines it replaces. An empty string
            deletes them. Leave "suggestion" out whenever it would only be a sketch, the fix touches
            other lines, or the working tree already holds the fix.

          Take the pull request's diff from `gh pr diff ${{ github.event.pull_request.number }}`, and
          read files with the Read, Grep and Glob tools. Bash only runs gh pr view/diff/list, gh issue
          view/list, gh search, git status and git branch --show-current, each as one plain line: no
          quotes, pipes, redirections or shell variables, and no --jq, --template, -q or -t.
          A search runs without quotes. A symlink that leaves the checkout or enters .git, .github,
          .claude or .gemini was removed before the review, so git status shows it as deleted: that
          isn't part of the change.

          ${{ steps.memory-instructions.outputs.text }}
          ${{ steps.earlier.outputs.text }}
          ${{ inputs.instructions }}
        claude_args: >-
          --model ${{ steps.config.outputs.claude-model }}
          --tools "${{ steps.mode.outputs.tools }}"
          --allowedTools "Skill(code-review),Read(/${{ github.workspace }}/**),Read(/${{ steps.tools.outputs.reviewed }}/**),Read(~/.claude/projects/**),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git status:*),Bash(git branch --show-current)${{ steps.mode.outputs.allowed }}"
          --disallowedTools "${{ steps.mode.outputs.denied }}Read(//proc/**),Read(//sys/**),Read(//etc/**),Read(/${{ runner.temp }}/**),Read(//tmp/**),Read(/${{ github.workspace }}/.git/**),Read(~/.ssh/**),Read(~/.gnupg/**),Read(~/.config/**),Read(~/.docker/**),Read(~/.gradle/**),Read(~/.m2/**),Read(~/.git-credentials),Read(~/.gitconfig),Read(~/.netrc),Read(~/.npmrc),Read(~/.claude.json),Read(~/.claude/.credentials.json),Read(~/actions-runner/**),Read(~/runners/**),ScheduleWakeup,Monitor,SendMessage"

    - id: claude-end
      if: ${{ !cancelled() && steps.claude-start.outputs.ts != '' }}
      shell: bash
      env:
        START_TS: ${{ steps.claude-start.outputs.ts }}
        STATE: ${{ steps.tools.outputs.state }}
        CLAUDE_MODEL: ${{ steps.config.outputs.claude-model }}
        CLAUDE_EFFORT: ${{ steps.config.outputs.claude-effort }}
      run: |
        end_ts=$(date +%s)
        duration=$((end_ts - START_TS))
        [ "$duration" -ge 0 ] || duration=0
        jq -cn \
          --arg model "$CLAUDE_MODEL" \
          --arg effort "$CLAUDE_EFFORT" \
          --argjson duration "$duration" \
          '{provider: "claude", model: $model, effort: $effort, duration_seconds: $duration}' \
          > "$STATE/claude-meta.json"
        echo "Claude review finished in ${duration}s"

    - name: Post the findings
      if: ${{ !cancelled() && steps.tools.outputs.dir != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        FIX_PUSH_TOKEN: ${{ inputs.github-token || github.token }}
        HAS_GITHUB_TOKEN: ${{ inputs.github-token != '' }}
        CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TOOLS: ${{ steps.tools.outputs.dir }}
        STATE: ${{ steps.tools.outputs.state }}
        STARTED: ${{ steps.tools.outputs.started }}
        BOT_LOGIN: ${{ steps.config.outputs.bot-login }}
        BOT_ID: ${{ steps.config.outputs.bot-id }}
        PROVIDERS: ${{ steps.config.outputs.providers }}
        RUN_CLAUDE: ${{ steps.config.outputs.run-claude }}
        RUN_GEMINI: ${{ steps.config.outputs.run-gemini }}
        FIX: ${{ inputs.fix }}
      run: |
        if [ "$RUN_CLAUDE" = true ]; then
          if [ -f "$STATE/.hook-log" ]; then
            "$TOOLS/post-review.sh" --redact < "$STATE/.hook-log" || echo "::warning::The Stop hook's log couldn't be printed."
          else
            echo "The Stop hook left no log: it didn't run."
          fi
          for attempt in 1 2 3 4; do
            if posted=$("$TOOLS/post-review.sh" --already "$PR_NUMBER"); then
              echo "The review was posted from the session: $posted"
              exit 0
            elif [ $? -eq 2 ] && [ -f "$STATE/.posted" ]; then
              echo "::warning::GitHub's reviews couldn't be read, so the hook's marker is trusted and nothing more is posted."
              exit 0
            fi
            [ -f "$STATE/.posted" ] || break
            if [ "$attempt" -eq 4 ]; then
              echo "::warning::GitHub doesn't list the review the Stop hook posted yet, so its marker is trusted and nothing more is posted."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The Claude Stop hook didn't post the review, so the posting step takes over."
        fi

        if [ "$RUN_CLAUDE" = true ] && [ ! -f "$STATE/claude-findings.json" ] && [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
          claude_raw=$(jq -r '[.[] | select(.type == "result")] | last | .result // ""' "$EXECUTION_FILE" |
            python3 "$TOOLS/extract-findings.py" || true)
          if [ -n "$claude_raw" ]; then
            jq -c 'map(if type == "object" then . + {provider: "claude"} else . end)' <<< "$claude_raw" \
              > "$STATE/claude-findings.json"
          fi
        fi

        merge_args=()
        warnings=()
        if [ "$RUN_GEMINI" = true ]; then
          if [ -f "$STATE/gemini-findings.json" ]; then
            merge_args+=("gemini:$STATE/gemini-findings.json")
          else
            warnings+=("Gemini ended without a findings list.")
          fi
        fi
        if [ "$RUN_CLAUDE" = true ]; then
          if [ -f "$STATE/claude-findings.json" ]; then
            merge_args+=("claude:$STATE/claude-findings.json")
          else
            warnings+=("Claude ended without a findings list.")
          fi
        fi

        provider_warnings=""
        if [ "${#warnings[@]}" -gt 0 ]; then
          provider_warnings=$(IFS=' '; echo "${warnings[*]}")
        fi

        if [ "${#merge_args[@]}" -eq 0 ]; then
          PROVIDER_WARNINGS="$provider_warnings" "$TOOLS/post-review.sh" "$PR_NUMBER" < /dev/null
          exit 0
        fi

        findings=$(python3 "$TOOLS/merge-findings.py" "${merge_args[@]}")
        if [ -z "$findings" ]; then
          PROVIDER_WARNINGS="$provider_warnings" "$TOOLS/post-review.sh" "$PR_NUMBER" < /dev/null
          exit 0
        fi

        # Only push fixes from the fallback step when Claude didn't own the App OIDC token
        # (i.e. Gemini-only runs or runs with an explicit custom github-token). Otherwise a
        # GITHUB_TOKEN push would skip downstream check workflows on the fix commit.
        if [ "$FIX" = true ] && [ ! -f "$STATE/.pushed" ] && { [ "$RUN_CLAUDE" != true ] || [ "$HAS_GITHUB_TOKEN" = true ]; }; then
          # If Claude ran and failed or left no findings list, revert any unconfirmed Claude edits
          # and restore only Gemini's confirmed patch (if any) before committing.
          if [ "$RUN_CLAUDE" = true ] && { [ "$CLAUDE_OUTCOME" != success ] || [ ! -f "$STATE/claude-findings.json" ]; }; then
            if [ -n "$(git diff --diff-filter=M --name-only 2> /dev/null)" ]; then
              git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                diff --diff-filter=M --name-only -z |
                git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                  checkout --pathspec-from-file=- --pathspec-file-nul 2> /dev/null || true
            fi
            if [ -s "$STATE/gemini-fixes.patch" ]; then
              git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                apply "$STATE/gemini-fixes.patch" 2> /dev/null || true
            fi
          fi
          if sha=$("$TOOLS/commit-fixes.sh" <<< "$findings" 2> "$STATE/.commit-log"); then
            echo "$sha" > "$STATE/.pushed"
            echo "Pushed the fixes as $sha"
          else
            echo "::notice::No fixes pushed: $(tr '\n' ' ' < "$STATE/.commit-log")"
          fi
        fi
        if [ -f "$STATE/.pushed" ]; then
          FIXED_IN=$(cat "$STATE/.pushed")
          export FIXED_IN
        fi

        PROVIDER_WARNINGS="$provider_warnings" "$TOOLS/post-review.sh" "$PR_NUMBER" <<< "$findings"

    - id: summary
      name: Comment what the review cost and took
      if: ${{ !cancelled() && steps.event.outputs.review == 'true' && steps.tools.outputs.dir != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        GEMINI_EXECUTION_FILE: ${{ steps.tools.outputs.state }}/gemini-execution.json
        FIX: ${{ inputs.fix }}
        CLAUDE_OAUTH: ${{ inputs.claude-oauth-token != '' }}
        SHOW_MICRO_COSTS: ${{ inputs.show-micro-costs }}
        POST_COST: ${{ inputs.cost }}
        STATE: ${{ steps.tools.outputs.state }}
        PROVIDERS: ${{ steps.config.outputs.providers }}
        CLAUDE_MODEL: ${{ steps.config.outputs.claude-model }}
        CLAUDE_EFFORT: ${{ steps.config.outputs.claude-effort }}
        GEMINI_MODEL: ${{ steps.config.outputs.gemini-model }}
        GEMINI_EFFORT: ${{ steps.config.outputs.gemini-effort }}
      run: |
        "${{ steps.tools.outputs.dir }}/post-cost.sh" "$PR_NUMBER"
        if [ -f "$STATE/summary.json" ]; then
          {
            echo "total-duration-seconds=$(jq -r '.total_duration_seconds // 0' "$STATE/summary.json")"
            echo "provider-durations=$(jq -c '.provider_durations // {}' "$STATE/summary.json")"
            echo "total-cost-usd=$(jq -r '.total_cost_usd // 0' "$STATE/summary.json")"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "total-duration-seconds=0"
            echo "provider-durations={}"
            echo "total-cost-usd=0"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: List the tools the review was denied
      if: always() && steps.tools.outputs.dir != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        TOOLS: ${{ steps.tools.outputs.dir }}
        STATE: ${{ steps.tools.outputs.state }}
      run: |
        if [ -f "$STATE/.guard-log" ]; then
          "$TOOLS/post-review.sh" --redact < "$STATE/.guard-log" | sort | uniq -c | while read -r count tool; do
            echo "::warning::The review's guard refused $tool ($count time(s))."
          done || echo "::warning::Couldn't read the commands the guard refused."
        fi
        [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ] || exit 0
        if ! denied=$(jq -r '.[] | select(.type == "result") | .permission_denials[]?
          | if .tool_name == "Bash"
            then [.tool_input.command // "" | split("\n")[0] | splits("\\s*(&&|\\|\\||\\||;)\\s*") | select(. != "")]
              | map([splits("\\s+") | select(. != "" and (test("^[A-Za-z_][A-Za-z0-9_]*=") | not))]
                | "Bash("
                  + ([(.[0] // "" | select(test("^[A-Za-z./][A-Za-z0-9._/-]*$")) // "?"),
                      (.[1] // "" | select(test("^(-[A-Za-z0-9-]*|[a-z][a-z0-9-]*)$"))),
                      (if .[0] == "gh" then (.[2] // "" | select(test("^[a-z][a-z0-9-]*$"))) else empty end)]
                     | join(" "))
                  + ")")
              | join(" + ")
            else .tool_name end' "$EXECUTION_FILE"); then
          echo "::warning::Couldn't read the tools the review was denied."
          exit 0
        fi
        [ -n "$denied" ] || exit 0
        sort <<< "$denied" | uniq -c | while read -r count tool; do
          echo "::warning::The review was denied $tool ($count time(s))."
        done

    - name: Fail when every enabled provider failed
      if: ${{ !cancelled() && steps.event.outputs.review == 'true' }}
      shell: bash
      env:
        RUN_CLAUDE: ${{ steps.config.outputs.run-claude }}
        RUN_GEMINI: ${{ steps.config.outputs.run-gemini }}
        CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
      run: |
        any_ok=false
        [ "$RUN_GEMINI" = true ] && [ "$GEMINI_OUTCOME" = success ] && any_ok=true
        [ "$RUN_CLAUDE" = true ] && [ "$CLAUDE_OUTCOME" = success ] && any_ok=true
        if [ "$any_ok" != true ]; then
          echo "::error::Every enabled AI review provider failed."
          exit 1
        fi
