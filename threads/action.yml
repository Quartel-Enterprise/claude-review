name: 'AI review threads'
description: "Counts a pull request's unresolved review threads, or re-runs the checks the review gate held for them"

inputs:
  command:
    description: "'open-threads' to count the unresolved threads of pull-request, or 'rerun-held' to re-run the held runs of sha."
    required: true
  pull-request:
    description: 'The pull request number. Required for open-threads.'
    required: false
    default: ''
  review-only:
    description: "'true' to count only the threads the AI review opened, for open-threads."
    required: false
    default: 'false'
  bot-login:
    description: "The login of the bot user the review posts as (e.g. claude[bot], github-actions[bot], or your GitHub App's bot). Required when review-only is 'true'."
    required: false
    default: ''
  sha:
    description: 'The commit whose held runs to re-run. Required for rerun-held.'
    required: false
    default: ''
  hold-step:
    description: "The name of the caller's step that fails when the gate holds the checks, for rerun-held."
    required: false
    default: 'Hold for the open threads'
  token:
    description: 'A token that reads pull requests and, for rerun-held, writes actions.'
    required: false
    default: ${{ github.token }}
outputs:
  count:
    description: 'How many threads are unresolved (open-threads), or how many runs were re-run (rerun-held).'
    value: ${{ steps.run.outputs.count }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        COMMAND: ${{ inputs.command }}
        PR_NUMBER: ${{ inputs.pull-request }}
        REVIEW_ONLY: ${{ inputs.review-only }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        SHA: ${{ inputs.sha }}
        HOLD_STEP: ${{ inputs.hold-step }}
      run: |
        case "$COMMAND" in
          open-threads)
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::pull-request is required for command 'open-threads'."
              exit 2
            fi
            args=(open-threads "$PR_NUMBER")
            if [ "$REVIEW_ONLY" = true ]; then
              if ! [[ "$BOT_LOGIN" =~ ^[A-Za-z0-9-]+\[bot\]$ ]]; then
                echo "::error::bot-login is required when review-only is 'true' (e.g. claude[bot] or github-actions[bot])."
                exit 2
              fi
              args+=(--review-only)
            fi
            count=$("$GITHUB_ACTION_PATH/review_gate.sh" "${args[@]}")
            ;;
          rerun-held)
            if [ -z "$SHA" ]; then
              echo "::error::sha is required for command 'rerun-held'."
              exit 2
            fi
            count=$("$GITHUB_ACTION_PATH/review_gate.sh" rerun-held "$SHA")
            ;;
          *)
            echo "::error::Unknown command '$COMMAND': use open-threads or rerun-held."
            exit 2
            ;;
        esac
        echo "count=$count" >> "$GITHUB_OUTPUT"
